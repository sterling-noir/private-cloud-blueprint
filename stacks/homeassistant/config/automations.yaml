- id: matrix_home_assist
  alias: "Home room: commands from Owner via Assist"
  description: "bot-policy.md: only @owner, only the Home room; Assist acts only on exposed devices."
  mode: queued
  max: 5
  triggers:
    - trigger: event
      event_type: matrix_command
      event_data:
        command: assist
  conditions:
    - condition: template
      value_template: "{{ trigger.event.data.sender == '@owner:home.example.ts.net' }}"
  actions:
    - action: conversation.process
      data:
        text: "{{ trigger.event.data.args.text }}"
      response_variable: result
    - action: notify.matrix
      data:
        message: "{{ result.response.speech.plain.speech | default('Sorry, I did not get an answer from Assist.') }}"
- id: bot_alert_internet_down
  alias: "Alert: internet down (urgent)"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.x55pro_wan_status
      to: "off"
      for: "00:03:00"
  actions:
    - action: script.bot_notify
      data:
        urgent: true
        message: "The house internet has been down since {{ (now() - timedelta(minutes=3)).strftime('%-I:%M %p') }}. Home Assistant still runs inside the house."
- id: bot_alert_internet_back
  alias: "Alert: internet back"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.x55pro_wan_status
      from: "off"
      to: "on"
  conditions:
    - condition: template
      value_template: "{{ (now() - trigger.from_state.last_changed).total_seconds() > 180 }}"
  actions:
    - action: script.bot_notify
      data:
        message: "The house internet is back, after {{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int }} minutes."
- id: bot_alert_vacuum_error
  alias: "Alert: vacuum or dock error (urgent)"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.q8_max_vacuum_error
      for: "00:01:00"
    - trigger: state
      entity_id: sensor.q8_max_dock_dock_error
      for: "00:01:00"
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | lower not in ['none', 'ok', 'unknown', 'unavailable', ''] }}"
  actions:
    - action: script.bot_notify
      data:
        urgent: true
        message: "The vacuum needs help: {{ trigger.to_state.state | replace('_', ' ') }} ({{ 'dock' if 'dock' in trigger.entity_id else 'robot' }})."
- id: bot_alert_backup_failed
  alias: "Alert: Home Assistant backup failed (urgent)"
  mode: single
  triggers:
    - trigger: state
      entity_id: event.backup_automatic_backup
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'failed' }}"
  actions:
    - action: script.bot_notify
      data:
        urgent: true
        message: "Home Assistant's automatic backup failed. Tell Claude."
- id: bot_note_vacuum_done
  alias: "Note: vacuum finished"
  mode: single
  triggers:
    - trigger: state
      entity_id: vacuum.q8_max
      from: "cleaning"
      to: ["returning", "docked"]
  actions:
    - action: script.bot_notify
      data:
        message: "The vacuum finished cleaning ({{ states('sensor.q8_max_cleaning_area') }} {{ state_attr('sensor.q8_max_cleaning_area', 'unit_of_measurement') or '' }}) and is going back to the dock."
- id: bot_note_vacuum_water
  alias: "Note: vacuum water tank empty"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.q8_max_water_shortage
      to: "on"
      for: "00:01:00"
  actions:
    - action: script.bot_notify
      data:
        message: "The vacuum's water tank is empty."
- id: bot_counter_reset
  alias: "Bot: reset daily message count"
  triggers:
    - trigger: time
      at: "00:00:00"
  actions:
    - action: counter.reset
      target:
        entity_id: counter.bot_messages_today
- id: bot_alerts_selftest
  alias: "Bot: one-time alert self-test"
  description: "Sends one test message after setup, then turns itself off."
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:01:30"
    - action: script.bot_notify
      data:
        urgent: true
        message: "Test: alerts are set up. Urgent alerts look like this one. Nothing to do."
    - action: automation.turn_off
      target:
        entity_id: automation.bot_one_time_alert_self_test


# Home Assistant container (moved from a hand-typed docker run to compose on 2026-11-03, Phase 4b).
# Image pinned to the digest of 2026.9.3. To update: back up ~/homeassistant, change the digest, docker compose up -d
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82  # 2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    mem_limit: 1536m
    environment:
      TZ: America/New_York
    volumes:
      - <REDACTED>:/config
